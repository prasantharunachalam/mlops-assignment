<div class="models-container">
  <div class="header">
    <h1>Models</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create Model
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!loading && models.length === 0" class="empty-state">
    <p>No models found</p>
  </div>

  <div class="models-grid" *ngIf="!loading && models.length > 0">
    <mat-card *ngFor="let model of models" class="model-card">
      <mat-card-header>
        <mat-card-title>{{ model.name }}</mat-card-title>
        <mat-card-subtitle>{{ model.owner }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ model.description || 'No description' }}</p>
        <small>Created: {{ model.created_at | date:'short' }}</small>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="viewModel(model.id)">
          View Details
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
